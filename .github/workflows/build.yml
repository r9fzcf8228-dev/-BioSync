name: Build BioSync IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # غيرنا الخادم إلى macos-14 لأنه أقل ازدحاماً من macos-15
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      
      - name: Install XcodeGen
        run: brew install xcodegen
        
      - name: Generate Project
        run: xcodegen generate
        
      # كود ذكي لإعادة المحاولة إذا فشل البناء بسبب ضغط الخادم
      - name: Build with Retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 60
          command: |
            xcodebuild -project BioSync.xcodeproj -scheme BioSync -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ONLY_ACTIVE_ARCH=NO SWIFT_OPTIMIZATION_LEVEL="-Onone" build
            
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BioSync.app Payload/
          zip -r BioSync.ipa Payload
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BioSync-ipa
          path: BioSync.ipa
